<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OE8CTK | Amateur Radio & Electronics Projects</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<h1>OE8CTK</h1>
<p>Amateur Radio • Electronics • Homebrew Projects</p>
</header>

<!-- Slider -->
<div class="slider" id="slider"></div>

<div class="container">

<!-- Filter -->
<div class="filterbar">
<label>Filter:</label>
<select onchange="filterProjects(this.value)">
<option value="all">All Projects</option>
<option value="transceiver">Transceivers</option>
<option value="antenna">Antennas</option>
<option value="digital">Digital</option>
<option value="portable">Portable</option>
<option value="repair">Repairs</option>
</select>
</div>

<!-- Project Grid -->
<div class="grid" id="projectGrid"></div>

</div>

<footer>
<p>© 2026 OE8CTK – Amateur Radio & Electronics Projects</p>
<p style="opacity:0.8;">Last updated: <span id="date"></span></p>
</footer>

<!-- Scripts -->
<script src="projects.js"></script>
<script src="slider.js"></script>
<script src="filter.js"></script>
<script>
document.getElementById("date").innerText = new Date().toLocaleDateString();
</script>

</body>
</html>
